mutation AddItemToOrder($productVariantId: ID!, $quantity: Int!) {
  addItemToOrder(productVariantId: $productVariantId, quantity: $quantity) {
    __typename

    ... on Order {
      id
      code
      totalQuantity
      totalWithTax
      currencyCode
    }

    ... on ErrorResult {
      errorCode
      message
    }
  }
}

query GetActiveOrder {
  activeOrder {
    id
    code
    totalQuantity
    totalWithTax
    currencyCode
  }
}
