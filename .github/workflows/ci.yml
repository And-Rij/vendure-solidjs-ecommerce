name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Quality checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: vendure
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 6544:5432
        options: >-
          --health-cmd "pg_isready -U vendure -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Lint root configuration
        run: pnpm exec eslint eslint.config.mjs --max-warnings 0

      - name: Check generated GraphQL files
        run: pnpm run codegen:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Install Chromium for E2E
        run: pnpm --filter @karpaty-gear/storefront exec playwright install --with-deps chromium

      - name: Prepare storefront environment for E2E
        run: cp apps/storefront/.env.example apps/storefront/.env

      - name: Test demo seed and cart E2E
        run: pnpm --filter @karpaty-gear/commerce test:seed
        env:
          ALLOW_DEMO_SEED_TEST: "true"
          SEED_TEST_E2E: "true"

env:
  APP_ENV: test
  DB_HOST: 127.0.0.1
  DB_PORT: "6544"
  DB_NAME: postgres
  DB_USERNAME: vendure
  DB_PASSWORD: ci-postgres-password
  SUPERADMIN_USERNAME: ci-admin
  SUPERADMIN_PASSWORD: ci-superadmin-password-1234
